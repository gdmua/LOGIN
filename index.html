<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Sistema UTM Valle del Cauca</title>
  
  <!-- Fuente -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 800px at 8% -10%, #11213a 0%, #0b1220 40%, #0a0f1a 100%);
      color: #e5edff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .login-container {
      background: linear-gradient(135deg, rgba(11, 18, 32, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(2, 8, 23, 0.6);
      backdrop-filter: blur(10px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-header h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #b6ccff, #60a5fa, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #c7d2fe;
      font-size: 1rem;
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #e5edff;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      color: #e5edff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .demo-credentials {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .demo-credentials h3 {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
    }

    .credential-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .credential-item:last-child {
      border-bottom: none;
    }

    .credential-item span:first-child {
      color: #c7d2fe;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .credential-item span:last-child {
      color: #60a5fa;
      font-family: monospace;
      font-size: 0.85rem;
      background: rgba(96, 165, 250, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
    }

    .error-message {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      color: #94a3b8;
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .login-container {
        margin: 1rem;
        padding: 2rem;
      }
      
      .login-header h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Gobernación del Valle del Cauca</h1>
      <p>Sistema de Gestión de UAS</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          type="text" 
          id="username" 
          placeholder="Ingresa tu usuario"
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
        >
      </div>

      <div class="error-message" id="errorMessage"></div>

      <button type="submit" class="login-btn">Ingresar al Sistema</button>
    </form>

    <div class="footer">
      Gobernación del Valle del Cauca
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      
      // Credenciales válidas
      const validCredentials = [
        { user: 'admin', pass: 'utm2025' },
        { user: 'operador', pass: 'drone123' },
        { user: 'valle', pass: 'cauca2025' },
        { user: 'simulacion', pass: 'drones' }
      ];
      
      // Verificar credenciales
      const isValid = validCredentials.some(cred => 
        cred.user === username && cred.pass === password
      );
      
      if (isValid) {
        // Login exitoso
        errorMessage.textContent = '';
        errorMessage.style.color = '#10b981';
        errorMessage.textContent = '✓ Acceso concedido, redirigiendo...';
        
        // Simular carga y redirección
        setTimeout(() => {
          window.location.href = 'https://gdmua.github.io/SISTEMA-DE-GESTION-UAS/'; 
        }, 1000);
        
      } else {
        // Login fallido
        errorMessage.style.color = '#ef4444';
        errorMessage.textContent = '✗ Usuario o contraseña incorrectos';
        
        // Efecto de shake en el formulario
        document.querySelector('.login-container').style.animation = 'shake 0.5s';
        setTimeout(() => {
          document.querySelector('.login-container').style.animation = '';
        }, 500);
      }
    });

    // Agregar animación shake
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Focus en el primer campo al cargar
    document.getElementById('username').focus();
  </script>
</body>
</html>
