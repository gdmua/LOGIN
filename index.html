<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Sistema UTM Valle del Cauca</title>
  
  <!-- Fuente moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #333333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      
      /* OPCIÓN 1: Imagen más pequeña centrada */
      background-image: url('https://participacionyciudadania.valledelcauca.gov.co/storage/Clientes/Gobernacion/participacionyciudadania/imagenes/VDC_El_paraiso_de_todos-19.png');
      background-size: 60%; /* Controla el tamaño de la imagen */
      background-position: right;
      background-repeat: no-repeat;
      background-color: #f8fafc; /* Color de fondo alrededor de la imagen */
      
      /* OPCIÓN 2: Imagen como patrón (se repite) */
      /*
      background-image: url('https://participacionyciudadania.valledelcauca.gov.co/storage/Clientes/Gobernacion/participacionyciudadania/imagenes/VDC_El_paraiso_de_todos-19.png');
      background-size: 300px 200px; /* Ancho y alto específicos */
      /* background-repeat: repeat; */
      
      /* OPCIÓN 3: Imagen en una posición específica */
      /*
      background-image: url('https://participacionyciudadania.valledelcauca.gov.co/storage/Clientes/Gobernacion/participacionyciudadania/imagenes/VDC_El_paraiso_de_todos-19.png');
      background-size: 40%;
      background-position: 80% 50%; /* Derecha-centro */
      /* background-repeat: no-repeat; */
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 3rem;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      margin-left: 10%;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .login-header {
      text-align: left;
      margin-bottom: 2.5rem;
    }

    .login-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: #64748b;
      font-size: 1rem;
      opacity: 0.9;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #334155;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      color: #334155;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0a295c;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      background: #ffffff;
    }

    .form-group input::placeholder {
      color: #94a3b8;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #0b7179, #0b7179);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .demo-credentials {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .demo-credentials h3 {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1rem;
      text-align: center;
      font-weight: 600;
    }

    .credential-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .credential-item:last-child {
      border-bottom: none;
    }

    .credential-item span:first-child {
      color: #475569;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .credential-item span:last-child {
      color: #3b82f6;
      font-family: monospace;
      font-size: 0.85rem;
      background: rgba(59, 130, 246, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
    }

    .error-message {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
      min-height: 1.2rem;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      color: #64748b;
      font-size: 0.8rem;
    }

    .size-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .size-controls h4 {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .size-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 2px;
      cursor: pointer;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .login-container {
        margin: 1rem;
        max-width: 100%;
      }
      
      body {
        justify-content: center;
      }
      
      .size-controls {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 2rem;
      }
      
      .login-header h1 {
        font-size: 1.7rem;
      }
    }

    /* Animación shake para errores */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h2>Sistema de Gestión de Drones</h2>
      <p></p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">
          <i class="fas fa-user-circle"></i> Usuario
        </label>
        <div class="input-with-icon">
          <i class="fas fa-envelope input-icon"></i>
          <input 
            type="text" 
            id="username" 
            placeholder="Ingresa tu usuario"
            autocomplete="username"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-key"></i> Contraseña
        </label>
        <div class="input-with-icon">
          <i class="fas fa-lock input-icon"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          >
        </div>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i>
        Ingresar al Sistema
      </button>
    </form>

    <div class="footer">
      <i class="fas fa-helicopter"></i>
      Sistema de Simulación - Gobernación del Valle del Cauca
    </div>
  </div>

  <script>
    // Función para cambiar el tamaño del fondo
    function changeBackgroundSize(size) {
      document.body.style.backgroundSize = size;
      
      // Si es un tamaño pequeño, agregamos color de fondo
      if (size === '30%' || size === '60%') {
        document.body.style.backgroundColor = '#f8fafc';
      } else {
        document.body.style.backgroundColor = '';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      
      // Credenciales válidas
      const validCredentials = [
        { user: 'admin', pass: 'utm2025' },
        { user: 'operador', pass: 'drone123' },
        { user: 'valle', pass: 'cauca2025' },
        { user: 'simulacion', pass: 'drones' }
      ];
      
      // Verificar credenciales
      const isValid = validCredentials.some(cred => 
        cred.user === username && cred.pass === password
      );
      
      if (isValid) {
        // Login exitoso
        errorMessage.textContent = '';
        errorMessage.style.color = '#10b981';
        errorMessage.textContent = '✓ Acceso concedido, redirigiendo...';
        
        // Simular carga y redirección
        setTimeout(() => {
          window.location.href = 'https://gdmua.github.io/SISTEMA-DE-GESTION-UAS/';
        }, 1000);
        
      } else {
        // Login fallido
        errorMessage.style.color = '#ef4444';
        errorMessage.textContent = '✗ Usuario o contraseña incorrectos';
        
        // Efecto de shake en el formulario
        document.querySelector('.login-container').style.animation = 'shake 0.5s';
        setTimeout(() => {
          document.querySelector('.login-container').style.animation = '';
        }, 500);
      }
    });

    // Focus en el primer campo al cargar
    document.getElementById('username').focus();
  </script>
</body>
</html>
